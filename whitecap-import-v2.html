const log = (msg, cls='') => {
  const div = document.getElementById('log');
  div.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  div.scrollTop = div.scrollHeight;
};

async function api(method, path, body) {
  const res = await fetch(SUPA + path, {
    method, headers: {
      'apikey': KEY, 'Authorization': 'Bearer ' + KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : 'return=minimal'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const txt = await res.text();
  let json; try { json = JSON.parse(txt); } catch { json = txt; }
  if (!res.ok) throw new Error(`${res.status}: ${txt.slice(0,200)}`);
  return json;
}

// Clamp invalid dates (e.g. 2026-09-31 → 2026-09-30)
function clampDate(d) {
  if (!d) return null;
  const [y, m, day] = d.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate(); // day 0 of next month = last day of this month
  if (day > lastDay) return `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return d;
}

async function runImport() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  
  log('🔄 Fetching existing White Cap projects...', 'info');
  
  try {
    // 1. Fetch existing projects
    const projects = await api('GET', '/rest/v1/projects?client=eq.White+Cap&select=id,name&limit=500');
    log(`   Found ${projects.length} existing projects`, 'ok');
    
    const projMap = {};
    projects.forEach(p => projMap[p.name.trim().toLowerCase()] = p);
    
    // 2. Collect unique project names from Excel
    const excelProjects = [...new Set(DATA.map(r => r.project).filter(Boolean))];
    
    // 3. Create missing projects
    const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#ec4899'];
    let colorIdx = projects.length;
    for (const name of excelProjects) {
      if (!projMap[name.toLowerCase()]) {
        const np = await api('POST', '/rest/v1/projects', {
          name, client: 'White Cap',
          color: COLORS[colorIdx++ % COLORS.length],
          description: 'Imported from Excel.',
          assigned_users: []
        });
        const p = Array.isArray(np) ? np[0] : np;
        projMap[name.toLowerCase()] = p;
        log(`   ➕ Created project: ${name}`, 'ok');
      }
    }
    
    // 4. Fetch existing tasks
    const wcIds = Object.values(projMap).map(p => p.id).join(',');
    const allTasks = await api('GET', `/rest/v1/tasks?project_id=in.(${wcIds})&select=id,project_id,title,status,assignee,checker,scope,client_sub_date,det_weight,detailer&limit=2000`);
    log(`   Found ${allTasks.length} existing tasks`, 'info');
    
    const taskMap = {};
    allTasks.forEach(t => taskMap[t.project_id + '|' + t.title.trim().toLowerCase()] = t);
    
    // 5. Process each row
    let inserts = 0, updates = 0, skipped = 0, errors = 0;
    
    for (const row of DATA) {
      const proj = projMap[row.project.toLowerCase()];
      if (!proj) { skipped++; continue; }
      
      const key = proj.id + '|' + row.title.toLowerCase();
      const existing = taskMap[key];
      
      // Map Cancelled → Completed (hub doesn't have a Cancelled status)
      const effStatus = row.status === 'Cancelled' ? 'Completed' : row.status;
      const payload = {
        project_id: proj.id, title: row.title, client: 'White Cap',
        status: effStatus, assignee: row.assignee, detailer: row.detailer,
        checker: row.checker, scope: row.scope,
        client_sub_date: clampDate(row.client_sub_date),
        det_weight: row.det_weight,
        due_date: clampDate(row.client_sub_date),
        priority: 'Medium',
        tags: [],
        files: {},
      };
      
      try {
        if (existing) {
          const changed = existing.status !== payload.status ||
            existing.assignee !== payload.assignee ||
            existing.checker !== payload.checker ||
            existing.client_sub_date !== payload.client_sub_date ||
            existing.det_weight !== payload.det_weight ||
            existing.detailer !== payload.detailer;
          if (!changed) { skipped++; continue; }
          await api('PATCH', `/rest/v1/tasks?id=eq.${existing.id}`, payload);
          updates++;
        } else {
          await api('POST', '/rest/v1/tasks', payload);
          inserts++;
        }
      } catch(e) {
        log(`   ⚠ "${row.title}": ${e.message}`, 'err');
        errors++;
      }
    }
    
    document.getElementById('sInsert').textContent = inserts;
    document.getElementById('sUpdate').textContent = updates;
    
    log('', '');
    log(`✅ Done!`, 'ok');
    log(`   ➕ Inserted: ${inserts} new tasks`, 'ok');
    log(`   ✏️  Updated:  ${updates} tasks`, 'warn');
    log(`   ⏭  Skipped:  ${skipped} (no change)`, 'info');
    if (errors) log(`   ❌ Errors:   ${errors}`, 'err');
    
  } catch(e) {
    log('❌ Fatal: ' + e.message, 'err');
  }
  
  btn.disabled = false;
  btn.textContent = '↺ Run Again';
  btn.onclick = () => location.reload();
}
