name: Daily Submission Digest

# DISABLED — Vercel's built-in cron (vercel.json) is the sole sender.
# Having both GitHub Actions + Vercel cron fire at the same time caused
# a race condition that bypassed the date guard and sent duplicate emails.
# Re-enable only if Vercel cron is removed.
on:
  workflow_dispatch:          # Manual trigger only (no automatic schedule)

jobs:
  send-digest:
    name: Send 1 AM IST digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily digest
        run: |
          echo "Calling digest at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          RESPONSE=$(curl -s -w "\n%{http_code}" https://hub-rdsprojects.com/api/cron-daily?force=true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Digest API returned HTTP $HTTP_CODE"
            exit 1
          fi
